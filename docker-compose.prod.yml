# Releases build the nginx and api images in GitHub Actions and push them to GHCR;
# the VPS pulls the tag named by OBROK_TAG in .env. The build sections are a manual
# fallback (for nginx, build the docs first: apps/docs, npm run docs:build).
services:
  nginx:
    container_name: obrok_nginx
    image: ghcr.io/martintrifunov/obrok-web:${OBROK_TAG:-local}
    build:
      context: .
      dockerfile: apps/nginx/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://obrok.net}
        VITE_OSRM_URL: ${VITE_OSRM_URL:-https://obrok.net/route/v1}
        VITE_DEFAULT_VISIBLE_CHAINS: ${VITE_DEFAULT_VISIBLE_CHAINS:-Vero,Ramstore}
        VITE_RELEASE_VERSION: ${OBROK_TAG:-local}
    restart: unless-stopped
    volumes:
      - ./apps/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    environment:
      NODE_ENV: production
    ports:
      - 80:80
      - 443:443
    depends_on:
      - api
      - osrm
    networks:
      - obrok_prod_net
    command: "/bin/sh -c 'while :; do sleep 12h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    container_name: obrok_certbot
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - obrok_prod_net

  osrm:
    container_name: obrok_osrm
    image: osrm/osrm-backend
    restart: unless-stopped
    volumes:
      - ./data/map:/data
    command: osrm-routed --algorithm mld --port 5001 /data/macedonia-latest.osrm
    networks:
      - obrok_prod_net

  api:
    container_name: obrok_api
    image: ghcr.io/martintrifunov/obrok-api:${OBROK_TAG:-local}
    build:
      context: ./apps/server
      dockerfile: Dockerfile.prod
    restart: always
    # Forwards SIGTERM to node (not PID 1) so graceful shutdown runs on deploys.
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - ./apps/server/src/uploads:/app/src/uploads
      - obrok_reports:/app/src/data/reports
    depends_on:
      db:
        condition: service_healthy
    networks:
      - obrok_prod_net

  db:
    container_name: obrok_db
    image: mongo:8.0
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: obrok
    ports:
      - "127.0.0.1:6969:27017"
    volumes:
      - obrok_db:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - obrok_prod_net

networks:
  obrok_prod_net:
    driver: bridge

volumes:
  obrok_db:
  obrok_reports: