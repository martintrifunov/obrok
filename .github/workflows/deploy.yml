name: Deploy to VPS

on:
  release:
    types: [published]

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Production
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Execute Deployment over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          APP_DIR: ${{ vars.VPS_APP_DIR || '/home/maco/projects/obrok' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          envs: RELEASE_TAG,APP_DIR
          script: |
            set -e

            # Load nvm so the SSH session uses the correct Node version
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"

            # Navigate to the app checkout on the VPS (override with the VPS_APP_DIR repo variable)
            cd "$APP_DIR"
            
            echo "--- Fetching latest code for $RELEASE_TAG ---"
            # --force: a release tag that was deleted and re-created must replace the old one
            git fetch --tags --force
            git checkout -f $RELEASE_TAG
            
            echo "--- Injecting Dynamic Version into Frontend ---"
            # Ensure the client .env exists and add the version tag to it
            touch apps/client/.env
            sed -i '/VITE_RELEASE_VERSION/d' apps/client/.env
            echo "VITE_RELEASE_VERSION=$RELEASE_TAG" >> apps/client/.env
            
            echo "--- Building Documentation ---"
            cd apps/docs
            npm ci
            rm -rf .vitepress/cache
            npm run docs:build
            cd ../..
            
            echo "--- Rebuilding Docker Containers ---"
            docker compose -f docker-compose.prod.yml up --build -d
            
            echo "--- Restarting Nginx to pick up new docs ---"
            docker restart obrok_nginx
            
            echo "--- Cleaning up old dangling images ---"
            docker image prune -f